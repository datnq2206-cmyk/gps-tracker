<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GPS Tracker ESP32 - E-Ra</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; }
    #map { height: 100vh; width: 100%; }
    
    .info-box {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.95);
      padding: 12px 16px;
      border-radius: 10px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.25);
      font-size: 14px;
      line-height: 1.5;
      min-width: 180px;
    }
    .info-box b { color: #1a73e8; }
    
    .controls {
      position: absolute;
      bottom: 20px;
      left: 12px;
      z-index: 1000;
      display: flex;
      gap: 8px;
    }
    .controls button {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      background: #1a73e8;
      color: white;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .controls button:active { transform: scale(0.96); }
  </style>
</head>
<body>

  <div id="map"></div>

  <div class="info-box">
    <b>GPS Tracker ESP32</b><br>
    Lat: <span id="lat">--</span><br>
    Lon: <span id="lon">--</span><br>
    Tốc độ: <span id="speed">--</span> km/h<br>
    Vệ tinh: <span id="sats">--</span><br>
    Trạng thái: <span id="status">Đang chờ...</span>
  </div>

  <div class="controls">
    <button onclick="clearPath()">Xóa đường đi</button>
    <button onclick="followMe = !followMe">Theo dõi: <span id="followText">ON</span></button>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // ========== KHỞI TẠO BẢN ĐỒ ==========
    const map = L.map('map').setView([21.0285, 105.8542], 15); // Mặc định Hà Nội

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    // Marker vị trí hiện tại
    let marker = L.marker([21.0285, 105.8542], {
      title: "Thiết bị ESP32"
    }).addTo(map).bindPopup("Vị trí thiết bị").openPopup();

    // Đường đi
    let pathCoords = [];
    let polyline = L.polyline([], {
      color: '#1a73e8',
      weight: 5,
      opacity: 0.85
    }).addTo(map);

    let followMe = true; // Tự động theo dõi vị trí mới

    // ========== HÀM CẬP NHẬT VỊ TRÍ ==========
    function updatePosition(lat, lon, speed = 0, sats = 0) {
      const pos = [lat, lon];

      // Cập nhật marker
      marker.setLatLng(pos);
      marker.setPopupContent(`
        <b>Vị trí hiện tại</b><br>
        Lat: ${lat.toFixed(6)}<br>
        Lon: ${lon.toFixed(6)}<br>
        Tốc độ: ${speed.toFixed(1)} km/h<br>
        Vệ tinh: ${sats}
      `);

      // Thêm vào đường đi
      pathCoords.push(pos);
      polyline.setLatLngs(pathCoords);

      // Tự động di chuyển bản đồ theo vị trí
      if (followMe) {
        map.setView(pos, map.getZoom());
      }

      // Cập nhật bảng thông tin
      document.getElementById('lat').textContent = lat.toFixed(6);
      document.getElementById('lon').textContent = lon.toFixed(6);
      document.getElementById('speed').textContent = speed.toFixed(1);
      document.getElementById('sats').textContent = sats;
      document.getElementById('status').textContent = "Đang theo dõi";
      document.getElementById('status').style.color = "green";
    }

    // Nút xóa đường đi
    function clearPath() {
      pathCoords = [];
      polyline.setLatLngs([]);
    }

    // Nút bật/tắt theo dõi
    document.querySelector('.controls button:last-child').onclick = function() {
      followMe = !followMe;
      document.getElementById('followText').textContent = followMe ? "ON" : "OFF";
    };

    // ========== GIẢ LẬP DỮ LIỆU (để test ngay) ==========
    // Xóa đoạn này khi đã có dữ liệu thật từ ESP32
    let fakeLat = 21.0285;
    let fakeLon = 105.8542;
    setInterval(() => {
      fakeLat += (Math.random() - 0.5) * 0.0008;
      fakeLon += (Math.random() - 0.5) * 0.0008;
      updatePosition(fakeLat, fakeLon, Math.random() * 35 + 5, 7 + Math.floor(Math.random() * 6));
    }, 2500);
  </script>
</body>
</html>
